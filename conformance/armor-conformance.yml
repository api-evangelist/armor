standards:
- id: oauth2
  conforms: true
  evidence: nine of twelve v2 contracts declare oauth2 securitySchemes (clientCredentials against https://api.armor.com/auth/authorize;
    authorizationCode against https://auth.armor.com and https://api.armor.com/auth/token). The developer
    portal documents the ID-token + scoped-access-token model.
- id: oidc
  conforms: partial
  evidence: The token flow issues a signed OIDC-style ID token and mandates the openid, email and profile
    scopes, and identity is federated through ADFS at https://sts.armor.com/adfs/oauth2/authorize. However
    no /.well-known/openid-configuration is served on any Armor host, so the provider is not OIDC-discoverable.
- id: openapi-3
  conforms: true
  evidence: twelve OpenAPI 3.0.3 documents published at https://developer.armor.com/swagger/
- id: swagger-2
