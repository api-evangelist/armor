            text/json:
              schema:
                $ref: '#/components/schemas/FireHost.Services.Common.Infrastructure.PagedResultSet%5BFireHost.Infrastructure.Firewall.Models.Rules.RuleSet%5D'
        '400':
          description: Bad Request
        '403':
          description: Permission Denied
        '404':
          description: Not Found
      deprecated: false
  /firewall/{ovdcId}/services:
    get:
      tags:
      - Network Services
      summary: Get information about firewall services in your account. These services define the ports and protocols to be used as service groups in firewall rules, to determine the type of traffic being allowed or blocked.
      operationId: Services_GetServices
      parameters:
      - name: ovdcId
        in: path
        description: id for the device to retrieve rules
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ''
              example:
              - id: 4
                deviceId: 2
                location: DFW01
                accountId: 0
                name: HTTP
                description: ''
                values:
                - port: 80
                  protocol: TCP
                  subprotocol: null
                  isConsistent: false
                vcdOrgVdcId: 0
                ruleId: 0
                status: 0
                retryCount: 0
                isRetry: false
                joinedValues: tcp/80,udp/21
                concattedValues:
                - tcp/80
                - udp/21
                isReadOnly: false
                isDefaultGroupCopied: false
            text/json:
              schema:
                type: array
                items:
                  $ref: ''
        '400':
          description: Bad Request
      deprecated: false
    post:
      tags:
      - Network Services
      summary: Create firewall service groups.
      description: Protocol must be entered in lower-case letters
      operationId: Services_CreateService
      parameters:
      - name: ovdcId
        in: path
        description: id for the device to under which service needs to be created
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FireHost.Infrastructure.Firewall.Models.Services.ServiceCreatedDto'
              example:
                id: 5
                deviceId: 2
                location: DFW01
                accountId: 0
                name: TCP HTTP
                description: ''
                values:
                - port: 80
                  protocol: TCP
                  subprotocol: null
                  isConsistent: false
                vcdOrgVdcId: 0
                ruleId: 0
                status: 0
                retryCount: 0
                isRetry: false
                joinedValues: tcp/80,udp/21
                concattedValues:
                - tcp/80
                - udp/21
                isReadOnly: false
                isDefaultGroupCopied: false
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FireHost.Infrastructure.Firewall.Models.Services.ServiceCreatedDto'
        '400':
          description: Bad Request
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireHost.Services.Http.Firewall.ApiExamples.Models.CreateServiceSampleRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/FireHost.Services.Http.Firewall.ApiExamples.Models.CreateServiceSampleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FireHost.Services.Http.Firewall.ApiExamples.Models.CreateServiceSampleRequest'
        description: "name: Name for the service group<br /><br />\n            values: Array of ServiceValue objects<br /><br />\n            description: Description of the service group<br /><br />\n            location: Name of the location"
        required: true
  /firewall/{ovdcId}/services/{serviceGroupId}:
    get:
      tags:
      - Network Services
      summary: Get details about a specific firewall service group.
      operationId: Services_GetService
      parameters:
      - name: ovdcId
        in: path
        description: Device ID
        required: true
        schema:
          type: integer
          format: int32
      - name: serviceGroupId
        in: path
        description: Firewall Service Group ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ''
              example:
              - id: 4
                deviceId: 2
                location: DFW01
                accountId: 0
                name: HTTP
                description: null
                values:
                - port: 80
                  protocol: TCP
                  subprotocol: null
                  isConsistent: false
                vcdOrgVdcId: 0
                ruleId: 0
                status: 0
                retryCount: 0
                isRetry: false
                joinedValues: tcp/80,udp/21
                concattedValues:
                - tcp/80
                - udp/21
                isReadOnly: false
                isDefaultGroupCopied: false
            text/json:
              schema:
                type: array
                items:
                  $ref: ''
        '400':
          description: Bad Request
      deprecated: false
    put:
      tags:
      - Network Services
      summary: Update the details for a firewall service group.
      operationId: Services_UpdateService
      parameters:
      - name: ovdcId
        in: path
        description: id for the device to update service for
        required: true
        schema:
          type: integer
          format: int32
      - name: serviceGroupId
        in: path
        description: id of the service group
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FireHost.Infrastructure.Firewall.Models.Services.ServiceUpdatedDto'
              example:
                id: 4
                deviceId: 2
                location: DFW01
                name: HTTP
                description: Use this for inbound HTTP traffic
                values:
                - port: 80
                  protocol: tcp
                  subprotocol: null
                  isConsistent: false
                vcdOrgVdcId: 0
                status: 0
                retryCount: 0
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FireHost.Infrastructure.Firewall.Models.Services.ServiceUpdatedDto'
        '400':
          description: Bad Request
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireHost.Services.Http.Firewall.ApiExamples.Models.UpdateServiceSampleRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/FireHost.Services.Http.Firewall.ApiExamples.Models.UpdateServiceSampleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FireHost.Services.Http.Firewall.ApiExamples.Models.UpdateServiceSampleRequest'
        description: "id: Service Group ID (not used)<br /><br />\n            deviceId: id for the device to update rules (not used)<br /><br />\n            location: Name of the location<br /><br />\n            accountId: Account ID (not used)<br /><br />\n            name: The name of the service group<br /><br />\n            description: Description of the service group<br /><br />\n            values: Array of ServiceValue objects"
        required: true
    delete:
      tags:
      - Network Services
      summary: Delete a firewall service group.
      operationId: Services_DeleteService
      parameters:
      - name: ovdcId
        in: path
        description: id for the device to delete services for
        required: true
        schema:
          type: integer
          format: int32
      - name: serviceGroupId
        in: path
        description: id of the service group
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
      deprecated: false
  /firewall/rules/{ruleId}:
