                      isConsistent: false
                    vcdOrgVdcId: 0
                    ruleId: 0
                    status: 0
                    retryCount: 0
                    isRetry: false
                    joinedValues: tcp/80, udp/21
                    concattedValues:
                    - tcp/80, udp/21
                    isReadOnly: false
                    isDefaultGroupCopied: false
                  action: allow
                  name: VMA Web Traffic
                  description: null
                  sortOrder: 1
                  isEnabled: true
                  status: 0
                  retryCount: 0
                  providerRefId: 1067
                batchId: 00000000-0000-0000-0000-000000000000
                staged: true
                lastModified: '2015-12-13T02:31:33.53'
                status: null
