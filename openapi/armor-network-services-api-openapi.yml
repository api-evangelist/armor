                      subprotocol: null
                      isConsistent: false
                    vcdOrgVdcId: 0
                    ruleId: 0
                    status: 0
                    retryCount: 0
                    isRetry: false
                    joinedValues: tcp/80, udp/21
                    concattedValues:
                    - tcp/80, udp/21
                    isReadOnly: false
                    isDefaultGroupCopied: false
                  action: allow
                  name: VMA Web Traffic
                  description: null
                  sortOrder: 1
                  isEnabled: true
                  status: 0
                  retryCount: 0
                  providerRefId: 1067
                batchId: 00000000-0000-0000-0000-000000000000
                staged: true
                lastModified: '2015-12-13T02:31:33.53'
                status: null
                vcdOrgVdcId: 0
            text/json:
              schema:
                $ref: '#/components/schemas/FireHost.Services.Common.Infrastructure.PagedResultSet%5BFireHost.Infrastructure.Firewall.Models.Rules.RuleSet%5D'
        '400':
          description: Bad Request
        '403':
          description: Permission Denied
        '404':
          description: Not Found
      deprecated: false
  /firewall/{ovdcId}/rules/export:
    get:
      tags:
      - Network Services
      summary: Retrieve firewall rules for a orginaztion Vdc for csv export.
      operationId: Firewall_GetFirewallRuleCsvExport
      parameters:
      - name: ovdcId
        in: path
        description: id for the device to retrieve rules
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireHost.Services.Common.Infrastructure.PagedResultSet%5BFireHost.Infrastructure.Firewall.Models.Rules.RuleSet%5D'
              example:
                id: 1
