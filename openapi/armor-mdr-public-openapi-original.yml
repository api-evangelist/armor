        severity:
          type: string
          enum: [High, Medium, Low]
        detected_on:
          type: string
          format: date-time
        updated_on:
          type: string
          format: date-time
        assigned_to:
          type: string
        customer_id:
          type: string
        customer_name:
          type: string
        detection_method:
          type: string
        source_product:
          type: string
        ai_metrics:
          $ref: '#/components/schemas/AIMetrics'
        ai_investigation:
          $ref: '#/components/schemas/AIInvestigation'
        attack_story:
