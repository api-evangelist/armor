aid: armor
name: Armor
description: 'Armor (legal name Armor Defense Inc.) is a cybersecurity company headquartered in Plano,
  Texas, founded as FireHost in 2009 by Chris Drake and rebranded as Armor as its portfolio expanded from
  secure cloud hosting into managed security. Armor sells vendor-agnostic, cloud-native managed detection
  and response (Armor MDR), compliant managed private cloud (Armor Enterprise Cloud), the Armor Agent
  workload protection agent (formerly Armor Anywhere), and compliance and offensive-security professional
  services, to more than 1,700 organizations across 40 countries with a 24/7 follow-the-sun SOC operating
  from Plano, London, Singapore and Pune. Armor publishes a public developer portal at developer.armor.com
  that serves sixteen machine-readable contracts through ReDoc: four Swagger 2.0 documents for the original
  v1 Armor Services API on api.armor.com (account management, infrastructure, security and support, 254
  operations) and twelve OpenAPI 3.0.3 documents for the v2 platform on *.api.secure-prod.services (accounts,
  agent management, compliance and CSPM, container security, incident management, infrastructure management,
  log management, notifications, webhooks, the unified MDR public API, and the ARMOR-PSK and FH-AUTH authentication
  contracts). Armor also publishes a detailed first-party llms.txt at armor.com/llms.txt and holds SOC
  2 Type II, HITRUST CSF, PCI DSS Level 1 Service Provider, ISO 27001, TX-RAMP Level 2, HIPAA and Data
  Privacy Framework attestations.'
image: https://framerusercontent.com/images/iwYUUtUgg7arqxZ6LH5PMsmFouE.png
url: https://raw.githubusercontent.com/api-evangelist/armor/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
x-tier: profiled
