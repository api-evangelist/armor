- aid: armor:mdr-public-api
  name: Armor MDR Public API
  description: The unified public API for Armor MDR, spanning six subsystems behind one host. The Armor
    Intelligence Platform (AIP) endpoints return AI-processed incident analysis and entity threat intelligence.
    The Microsoft Defender integration lists machines, executes and tracks machine actions such as isolation
    and scans, and retrieves investigation packages and live-response results. Detection Rules exposes
    Microsoft Sentinel rules enriched with MITRE ATT&CK mappings. JSM middleware covers incidents, comments,
    metrics, service requests and organizations. Reports serves monthly security reports, and Threat Intelligence
    exposes threat actors plus an OpenCTI GraphQL proxy at POST /ti/graphql.
  humanURL: https://developer.armor.com/
  baseURL: https://mdr.api.secure-prod.services
  tags:
  - MDR
  - Threat
  - Intelligence
  - Microsoft
