- aid: armor:log-management-api
  name: Armor Log Management API
  description: SIEM log ingestion and routing for the Armor platform, and the only v2 Armor API published
    on an armor.com host as well as the secure-prod.services tier. Endpoints manage log sources and log
    groups, flow sources, log endpoints, and the access control lists that govern which networks may ship
    logs to Armor, plus a meta surface describing supported source types. Uses an OAuth 2.0 authorization-code
    flow against api.armor.com.
  humanURL: https://developer.armor.com/
  baseURL: https://api.logs.armor.com
