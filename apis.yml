apis:
- aid: armor:fh-auth-api
  name: Armor FH-AUTH Security API
  description: The token-based authentication API for the Armor security platform. POST /auth/authorize
    exchanges user credentials for an authorization code that must be redeemed within two minutes; POST
    /auth/token exchanges that code for an access token (valid 15 minutes) and an ID token; POST /auth/token/reissue
    refreshes an expiring or expired access token; and GET /me returns the authenticated user profile
    and the accounts the token can act on. Every downstream Armor API call carries the FH-AUTH bearer
    token plus an X-Account-Context header naming the Armor account the request applies to.
  humanURL: https://developer.armor.com/
  baseURL: https://api.armor.com
  tags:
  - Authentication
  - OAuth2
  - Bearer
  - Tokens
  - Identity
  properties:
  - type: Documentation
    url: https://developer.armor.com/
  - type: APIReference
    url: https://developer.armor.com/swagger/security.fh-auth.yaml
  - type: OpenAPI
    url: openapi/armor-fh-auth-openapi-original.yml
  - type: Authentication
    url: authentication/armor-authentication.yml
  - type: Overlay
    url: overlays/armor-fh-auth-overlay.yaml
- aid: armor:armor-psk-api
  name: Armor ARMOR-PSK Security API
  description: 'The signature-based authentication scheme for the Armor platform, an alternative to FH-AUTH
    tokens that removes the refresh flow entirely. An API Key ID and Secret Key are generated in the Armor
    Management Portal, then every request carries an Authorization: ARMOR-PSK {key_id}:{signature}:{nonce}:{timestamp}
    header whose signature is a base64 HMAC-SHA512 over the concatenation of key id, HTTP method, request
    path, nonce, timestamp and request body. GET /me is published as the reference operation for verifying
    a correctly signed request.'
  humanURL: https://developer.armor.com/
  baseURL: https://api.armor.com
  tags:
  - Authentication
  - HMAC
  - API
  - Keys
  - Request
  - Signing
  - Security
  properties:
  - type: Documentation
    url: https://developer.armor.com/
  - type: APIReference
    url: https://developer.armor.com/swagger/security.armor-psk.yaml
  - type: OpenAPI
    url: openapi/armor-psk-auth-openapi-original.yml
  - type: Authentication
    url: authentication/armor-authentication.yml
  - type: Overlay
    url: overlays/armor-psk-auth-overlay.yaml
- aid: armor:accounts-api
  name: Armor Accounts API
  description: Account-level configuration for the Armor security platform. Covers cloud connections (the
    credentials and subscriptions that link a customer AWS, Azure or Oracle Cloud environment to Armor),
    secure notes (encrypted per-account credential and runbook storage), and product tours. Authenticated
    with OAuth 2.0 client credentials against https://api.armor.com/auth/authorize, with separate dev,
    stage and production host tiers published in the specification.
  humanURL: https://developer.armor.com/
  baseURL: https://accounts.api.secure-prod.services
  tags:
  - Accounts
