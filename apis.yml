- aid: armor:infrastructure-management-api
  name: Armor Infrastructure Management API
  description: A small operational API exposing the Armor Toolbox, the utility surface used to run infrastructure
    management actions against protected hosts. It is the v2 successor to the much larger v1 Infrastructure
    API and currently publishes two operations, authenticated with OAuth 2.0 client credentials, an API
    key header, or an FH-AUTH bearer token.
