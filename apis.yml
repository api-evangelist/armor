- aid: armor:compliance-api
  name: Armor Compliance API
  description: The largest single Armor API surface, covering compliance assessments and cloud security
    posture management. Endpoints span CSPM connectors, policies, policy controls, control remediation,
    resources, summaries and usage; scheduled and on-demand CSPM report configuration and report retrieval;
    and vulnerability scanning with its exclusions and reports. This is the only Armor API that declares
    an OAuth 2.0 authorization-code flow against auth.armor.com rather than the client-credentials flow
    used elsewhere.
  humanURL: https://developer.armor.com/
  baseURL: https://compliance.api.secure-prod.services
  tags:
