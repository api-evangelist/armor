- aid: armor:container-security-api
  name: Armor Container Security API
  description: Container and registry security for the Armor platform, served on a /containers path prefix
    of the compliance host. Endpoints manage the container security account, the connector that binds
    a customer environment to Armor, container image inventory and scan results, the container registries
    under watch, and the runtime sensor deployed into customer clusters.
  humanURL: https://developer.armor.com/
  baseURL: https://compliance.api.secure-prod.services/containers
