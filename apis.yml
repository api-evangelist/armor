- aid: armor:incident-management-api
  name: Armor Incident Management API
  description: 'Programmatic access to the security detections Armor raises against a customer environment.
    Endpoints return individual security detections and their underlying detection events, an overview
    roll-up, trend data over time, and EDR-specific detection context. This is the read side of the Armor
    SOC: the detections surfaced here are the ones the 24/7 SOC triages, and they are the objects webhook
    subscriptions in the Webhooks API deliver.'
  humanURL: https://developer.armor.com/
  baseURL: https://security-detections.api.secure-prod.services
  tags:
