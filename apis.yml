  - type: Overlay
    url: overlays/armor-accounts-overlay.yaml
- aid: armor:agent-management-api
  name: Armor Agent Management API
  description: 'Fleet management for Armor Agent, the lightweight Windows and Linux workload protection
    agent formerly sold as Armor Anywhere. Endpoints cover health monitoring status across the agent estate,
    malware protection configuration, scheduled tasks, and the tag model used to group and target hosts.
    Supports three authentication schemes side by side: OAuth 2.0 client credentials, an API key header,
    and the FH-AUTH bearer token.'
  humanURL: https://developer.armor.com/
  baseURL: https://agent-management.api.secure-prod.services
  tags:
