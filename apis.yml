- aid: armor:webhooks-api
  name: Armor Webhooks API
  description: The subscription API for Armor event delivery. Callers register detection configurations
    (which security detections should be pushed, with default labels and a transform to reshape the delivered
    payload) and notification configurations, list the available event types, and manage both configuration
    families through create, read, update and delete operations. Armor publishes no AsyncAPI document;
    this OpenAPI is the machine-readable description of the event surface.
  humanURL: https://developer.armor.com/
  baseURL: https://webhooks.api.secure-prod.services
  tags:
