source: live GET of the /.well-known/ discovery surface on every Armor apis.yml and OpenAPI servers[]
  host
finding: Armor publishes NO /.well-known/ discovery documents. The marketing host www.armor.com and the
  developer portal developer.armor.com return a hard 404 for every well-known path. The v2 platform API
  hosts on *.api.secure-prod.services answer 403 {"message":"Missing Authentication Token"} for every
  path including /.well-known/*, so nothing is anonymously discoverable there. api.armor.com closes the
  connection on /.well-known/* while serving 401 on /me, so the host is live but the well-known namespace
  is not routed. Note that docs.armor.com, amp.armor.com and status.armor.com each return HTTP 200 with
  an HTML SPA shell for EVERY /.well-known/* path — those are catch-all false positives, not documents,
  and are recorded as such.
